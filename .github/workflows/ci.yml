name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Test decision rules
        run: bun run test

      - name: Build static application
        run: bun run build

      - name: Smoke test server
        shell: bash
        run: |
          NODE_ENV=production PORT=3000 bun src/server.ts > /tmp/creator-router.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true; cat /tmp/creator-router.log' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/api/catalog > /tmp/catalog.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"platformCount":14' /tmp/catalog.json
          test -f dist/index.html
          test -f dist/assets/client.js
          test -f dist/assets/styles.css
          test -f dist/assets/styles-components.css
          test -f dist/assets/styles-responsive.css
